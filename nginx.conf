worker_processes  3;
pid /tmp/nginx.pid; # Changed from /var/run/nginx.pid
error_log  /var/log/nginx/error.log;
events {
  worker_connections  10240;
}

http {
  include mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  server {
    listen 8080;
    # Redirects traffic to /index.html, our main entrypoint. If you have a multi-page application, add more locations
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: cache for a year, and 404 (not index.html) if missing
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: fall back to index.html, which must never be cached
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
