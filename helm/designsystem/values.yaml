replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/designsystem
  # latest is a moving tag, so always pull to pick up new builds on restart
  pullPolicy: Always
  # Staging tracks latest. Set to a release version (or "" to use the chart
  # appVersion) for a pinned deployment.
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# nginx-unprivileged runs as uid 101 and listens on 8080
securityContext:
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: designsystem.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
